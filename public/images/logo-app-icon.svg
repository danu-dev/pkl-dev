<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- White Emboss Gradient for 'S' -->
    <linearGradient id="appSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- 3D Shadow for internal curve -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#172554" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded App Icon Frame -->
  <rect width="512" height="512" rx="120" fill="url(#appBgGrad)" />

  <!-- Speed Lines & Dots (White / Cyan Accent) -->
  <!-- Line 1 -->
  <rect x="55" y="180" width="65" height="18" rx="9" fill="#93C5FD" />
  <circle cx="140" cy="189" r="9" fill="#FFFFFF" />

  <!-- Line 2 -->
  <rect x="95" y="215" width="45" height="18" rx="9" fill="#93C5FD" />
  <circle cx="70" cy="224" r="9" fill="#60A5FA" />

  <!-- Line 3 -->
  <rect x="45" y="255" width="90" height="18" rx="9" fill="#BFDBFE" />
  <circle cx="155" cy="264" r="9" fill="#FFFFFF" />

  <!-- Line 4 -->
  <rect x="75" y="295" width="80" height="18" rx="9" fill="#93C5FD" />
  <circle cx="55" cy="304" r="9" fill="#60A5FA" />

  <!-- Line 5 -->
  <rect x="100" y="335" width="65" height="18" rx="9" fill="#BFDBFE" />
  <circle cx="80" cy="344" r="9" fill="#93C5FD" />

  <!-- 3D Curve Shading (Deep Blue Ribbon Depth) -->
  <path d="M 225 265
           C 225 320, 250 365, 305 365
           C 355 365, 385 340, 410 310
           C 385 380, 290 405, 230 375
           C 185 350, 170 290, 225 265
           Z"
        fill="url(#innerShadow)" />

  <!-- Main Speed 'S' (Crisp White with 3D Bevel) -->
  <path d="M 185 150
           C 260 150, 345 150, 380 150
           C 415 150, 430 170, 410 200
           C 385 235, 325 258, 275 272
           C 235 284, 222 302, 228 328
           C 238 365, 305 375, 380 355
           C 402 349, 418 365, 400 382
           C 345 435, 235 435, 195 402
           C 155 370, 155 312, 185 270
           C 212 230, 280 215, 335 195
           C 362 186, 356 174, 330 174
           L 180 174
           C 165 174, 155 158, 168 150
           C 172 147, 178 150, 185 150
           Z"
        fill="url(#appSGrad)" />
</svg>
