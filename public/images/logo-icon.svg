<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Gradien Bayangan Lipatan 3D (3D Curve Shading) -->
    <linearGradient id="curve3dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="60%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Gradien Bagian Depan Terang (White / Ice Blue) -->
    <linearGradient id="frontBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Gradien Stream Lines -->
    <linearGradient id="speedLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Speed Lines & Dots (Kiri) -->
  <!-- Baris 1 -->
  <rect x="50" y="165" width="65" height="18" rx="9" fill="url(#speedLineGrad)" />
  <circle cx="135" cy="174" r="9" fill="#1E3A8A" />

  <!-- Baris 2 -->
  <rect x="90" y="200" width="45" height="18" rx="9" fill="url(#speedLineGrad)" />
  <circle cx="65" cy="209" r="9" fill="#60A5FA" />

  <!-- Baris 3 -->
  <rect x="40" y="240" width="85" height="18" rx="9" fill="url(#speedLineGrad)" />
  <circle cx="145" cy="249" r="9" fill="#2563EB" />

  <!-- Baris 4 -->
  <rect x="70" y="280" width="75" height="18" rx="9" fill="url(#speedLineGrad)" />
  <circle cx="50" cy="289" r="9" fill="#60A5FA" />

  <!-- Baris 5 -->
  <rect x="95" y="320" width="60" height="18" rx="9" fill="url(#speedLineGrad)" />
  <circle cx="75" cy="329" r="9" fill="#1E3A8A" />

  <!-- 3D Ribbon Shadow (Lengkungan Bawah Biru Tua Deep Navy) -->
  <path d="M 215 250
           C 215 310, 240 355, 290 355
           C 340 355, 370 330, 395 300
           C 370 370, 280 395, 220 365
           C 175 340, 160 280, 215 250
           Z"
        fill="url(#curve3dGrad)" />

  <!-- Main Speed 'S' Body (Emblem Huruf S Dinamis) -->
  <path d="M 175 140
           C 250 140, 330 140, 360 140
           C 395 140, 410 160, 390 190
           C 365 225, 310 245, 260 260
           C 220 272, 210 290, 215 315
           C 225 350, 290 360, 360 340
           C 380 334, 395 348, 380 365
           C 325 415, 220 415, 185 385
           C 150 355, 150 300, 175 260
           C 200 220, 265 205, 320 185
           C 345 177, 340 165, 315 165
           L 170 165
           C 155 165, 145 150, 155 140
           C 160 135, 168 140, 175 140
           Z"
        fill="url(#curve3dGrad)" />
</svg>
